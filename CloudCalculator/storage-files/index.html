<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <script src="visitor.js" defer></script>

</head>
<body>
    <div class="calc">
        <h1 class="title">Calculator</h1>
        <div id="visitor-container">
            <p>Visitors so far: <span id="visitor-count"></span></p>
        </div>
        <input type="text" id="display" name="text display"/>
        <div class="buttons">
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button class="operator">/</button>

            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button class="operator">X</button>

            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button class="operator">-</button>

            <button class="clear">C</button>
            <button class="number">0</button>
            <button class="dot">.</button>
            <button class="operator">+</button>

            <button class="equals">=</button>
        </div>
        <div class="history">
            <ul id="history-panel"></ul>
            <button id="history-clear">Clear History</button>
        </div>
    </div>

</body>
</html>
